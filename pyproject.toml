[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-rlo"
version = "0.4.0"
description = "FROZEN at 0.4.0: moved into ga-SDK as `ga rlo` (pip install ga-sdk). ga-SDK and rlo-SDK as one entry."
readme = "README.md"
requires-python = ">=3.10"
# 판 목록의 원본은 ga_rlo/_pins.py 다. 이 목록은 그것과 뜻이 같아야 한다(tests/test_pins.py).
dependencies = [
    "ga-sdk @ git+https://github.com/cogito5170/ga-SDK@af904fe7fe1a0da2ef817ca981422040cccc0718",
    "rlo-sdk[sensor] @ git+https://github.com/cogito5170/rlo-SDK@3323f88741c198f453370936c481c00fbd26d398",
]

[project.scripts]
ga-rlo = "ga_rlo.cli:main"

[tool.setuptools]
packages = ["ga_rlo"]
